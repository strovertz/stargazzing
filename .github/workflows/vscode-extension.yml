name: Extensão VS Code

on:
  pull_request:
    paths: ['vscode-extension/**', 'src/**', 'index.html', 'public/**', 'vite.config.ts', 'package*.json', '.github/workflows/vscode-extension.yml']
  push:
    branches: [main]
    paths: ['vscode-extension/**', 'src/**', 'index.html', 'public/**', 'vite.config.ts', 'package*.json', '.github/workflows/vscode-extension.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vsix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: vscode-extension
      - run: npm run package
        working-directory: vscode-extension
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stargazzing-vsix
          path: vscode-extension/stargazzing.vsix
          if-no-files-found: error
